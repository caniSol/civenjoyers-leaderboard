[project]
name = "civenjoyers-leaderboard"
version = "1.0.3"
description = "A leaderboard Webapp which tracks the ELO of our semi-regular Civ 6 sessions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "uvicorn>=0.52.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.0",
    "django-types>=0.24.0",
]
